name: allure-report

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    env:
      REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 📦 Instalar dependências
        working-directory: automation/web/cypress
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          echo "::group::Instalando dependências"
          npm ci
          echo "::endgroup::"

      - name: 🔍 Verificar cache do Cypress
        working-directory: automation/web/cypress
        run: |
          echo "::group::Cache Cypress"
          npx cypress cache path
          npx cypress cache list
          echo "::endgroup::"

      - name: 💾 Restaurar cache do Cypress
        id: cache-cypress
        uses: actions/cache@v3
        with:
          path: ~/.cache/Cypress
          key: cypress-cache-v2-${{ runner.os }}-${{ hashFiles('automation/web/cypress/package-lock.json') }}
          restore-keys: |
            cypress-cache-v2-${{ runner.os }}-
            cypress-cache-v2-

      - name: 📥 Instalar binário do Cypress
        working-directory: automation/web/cypress
        run: |
          echo "::group::Instalação Cypress"
          npx cypress install
          npx cypress cache list
          echo "::endgroup::"

      - name: 🚀 Executar testes
        working-directory: automation/web/cypress
        if: always()
        continue-on-error: true
        run: |
          echo "::group::Execução Cypress"
          npm run cy:run
          echo "::endgroup::"

      - name: 📚 Recuperar histórico do Allure
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: allure
          path: allure

      - name: 📊 Gerar relatório Allure
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: automation/web/cypress/allure-results
          allure_report: allure-report
          allure_history: allure-history

      - name: 🌐 Publicar GitHub Pages
        id: deploy
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: allure
          publish_dir: allure-history

      - name: 📝 Resumo da execução
        if: always()
        run: |
          echo "## ✅ Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repositório:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch publicada:** allure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 URL do relatório" >> $GITHUB_STEP_SUMMARY
          echo "${REPORT_URL}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> O GitHub Pages pode levar alguns minutos para atualizar após o deploy." >> $GITHUB_STEP_SUMMARY

      - name: 📢 Mostrar URL do relatório
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo " Allure Report"
          echo "=========================================="
          echo "${REPORT_URL}"
          echo "=========================================="